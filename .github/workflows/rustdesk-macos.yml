name: RustDesk macOS (Dentacom)

on:
  workflow_dispatch:
    inputs:
      rustdesk_tag:
        description: "RustDesk Release-Tag (z. B. 1.4.5)"
        required: true
        default: "1.4.5"

env:
  # Eure Server-Werte (nicht geheim, der Key ist ein Public Key)
  ID_SERVER: "dentacom.spdns.de"
  PUB_KEY: "JOq0OODtT5ZdfRK9GvcE4Q8pHyZaeAVmev7JHjDDWZ0="
  # Zusätzlich als Build-Variablen, falls die RustDesk-Version option_env! nutzt
  RENDEZVOUS_SERVER: "dentacom.spdns.de"
  RS_PUB_KEY: "JOq0OODtT5ZdfRK9GvcE4Q8pHyZaeAVmev7JHjDDWZ0="
  # Versionen passend zu RustDesk 1.4.5 (aus dessen flutter-build.yml)
  FLUTTER_VERSION: "3.24.5"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  MAC_RUST_VERSION: "1.81"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"

jobs:
  build-macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64          # Apple Silicon (M1/M2/M3/M4)
            target: aarch64-apple-darwin
            os: macos-14
            triplet: arm64-osx
          - arch: x86_64         # Intel-Macs
            target: x86_64-apple-darwin
            os: macos-15-intel
            triplet: x64-osx
    runs-on: ${{ matrix.os }}

    steps:
      - name: RustDesk-Quellcode holen
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: ${{ inputs.rustdesk_tag }}
          submodules: recursive

      - name: Server-Werte einsetzen
        run: |
          CFG=libs/hbb_common/src/config.rs
          sed -i '' -E "s|^pub const RENDEZVOUS_SERVERS: &\[&str\] = &\[.*\];|pub const RENDEZVOUS_SERVERS: \&[\&str] = \&[\"${ID_SERVER}\"];|" "$CFG"
          sed -i '' -E "s|^pub const RS_PUB_KEY: &str = \".*\";|pub const RS_PUB_KEY: \&str = \"${PUB_KEY}\";|" "$CFG"
          grep -n "RENDEZVOUS_SERVERS\|RS_PUB_KEY" "$CFG"
          grep -q "\"${ID_SERVER}\"" "$CFG" || { echo "::error::ID-Server nicht ersetzt"; exit 1; }
          grep -q "\"${PUB_KEY}\""   "$CFG" || { echo "::error::Key nicht ersetzt"; exit 1; }

      - name: Build-Werkzeuge installieren
        run: brew install llvm create-dmg nasm

      - name: Flutter installieren
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Flutter-Patch von RustDesk anwenden
        run: |
          cd "$(dirname "$(dirname "$(which flutter)")")"
          git apply "$GITHUB_WORKSPACE/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"

      - name: Rust installieren
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: ${{ matrix.target }}

      - name: Bridge-Generator installieren
        run: |
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version "$FLUTTER_RUST_BRIDGE_VERSION" --features uuid --locked

      - name: Flutter-Bridge generieren
        run: |
          (cd flutter && flutter pub get)
          flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h \
            --llvm-path "$(brew --prefix llvm)"

      - name: vcpkg einrichten
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

      - name: vcpkg-Bibliotheken installieren
        run: |
          "$VCPKG_ROOT/vcpkg" install --triplet ${{ matrix.triplet }} --x-install-root="$VCPKG_ROOT/installed"

      - name: RustDesk bauen
        run: python3 ./build.py --flutter

      - name: Signier-Zertifikat importieren
        env:
          P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KC_PW="$(openssl rand -base64 24)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: App signieren
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          APP=flutter/build/macos/Build/Products/Release/RustDesk.app
          ENT=flutter/macos/Runner/Release.entitlements
          [ -f "$ENT" ] || { echo "::error::$ENT fehlt"; ls flutter/macos/Runner; exit 1; }
          codesign --force --deep --timestamp --options runtime \
            --entitlements "$ENT" --sign "$SIGN_IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: DMG erstellen, signieren und notarisieren
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          DMG="rustdesk-${{ inputs.rustdesk_tag }}-${{ matrix.arch }}-dentacom.dmg"
          mkdir dmg_stage
          cp -R flutter/build/macos/Build/Products/Release/RustDesk.app dmg_stage/
          create-dmg --volname "RustDesk" --app-drop-link 450 170 --skip-jenkins "$DMG" dmg_stage/
          codesign --timestamp --sign "$SIGN_IDENTITY" "$DMG"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple "$DMG"
          spctl -a -t open --context context:primary-signature -v "$DMG"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: DMG bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DMG }}
          path: ${{ env.DMG }}

      - name: Schlüsselbund aufräumen
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
